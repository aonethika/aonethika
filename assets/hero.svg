**Thoughtful interfaces. Connected systems.**

I’m Avanthika, a full-stack developer who enjoys turning complex requirements into clear, usable products. I work across React interfaces, backend services, and databases—with care for the details that make everything feel cohesive.

[GitHub](https://github.com/aonethika) &nbsp; / &nbsp; [Repositories](https://github.com/aonethika?tab=repositories) &nbsp; / &nbsp; [Contributions](https://github.com/aonethika#contributions)

