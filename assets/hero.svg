<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Avanthika P S — Full-Stack Developer</title>
  <desc id="description">A dark violet and blue portfolio banner with a layered geometric illustration.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11121D"/>
      <stop offset="0.55" stop-color="#0C0E17"/>
      <stop offset="1" stop-color="#14172B"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1030 200) scale(480 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="72" y1="0" x2="1208" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>

    <linearGradient id="name" x1="72" y1="200" x2="760" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D5CFF3"/>
    </linearGradient>

    <linearGradient id="edge" x1="870" y1="120" x2="1150" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="panel" x1="900" y1="140" x2="1116" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28233F"/>
      <stop offset="1" stop-color="#121A2B"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#C4B5FD" stroke-opacity="0.04"/>
    </pattern>

    <clipPath id="frame">
      <rect x="1" y="1" width="1278" height="478" rx="24"/>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .mobile {
      display: none;
    }

    @media (max-width: 600px) {
      .desktop {
        display: none;
      }

      .mobile {
        display: inline;
      }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="480" fill="url(#background)"/>
    <rect width="1280" height="480" fill="url(#grid)"/>
    <rect width="1280" height="480" fill="url(#glow)"/>

    <path
      d="M72 0V480M1208 0V480M0 80H1280M0 400H1280"
      stroke="#D8D5FF"
      stroke-opacity="0.06"
    />

    <!-- Desktop layout -->
    <g class="desktop">
      <rect
        x="72" y="48"
        width="22" height="3"
        rx="1.5"
        fill="url(#accent)"
      />

      <text
        x="108" y="55"
        fill="#BCB8D3"
        font-size="13"
        letter-spacing="3"
      >AONETHIKA / DEVELOPER</text>

      <text
        x="1208" y="55"
        text-anchor="end"
        class="mono"
        fill="#9691AE"
        font-size="12"
        letter-spacing="1"
      >INTERFACE / LOGIC / DATA</text>

      <text
        x="72" y="165"
        class="mono"
        fill="#ABA4C8"
        font-size="14"
        letter-spacing="2"
      >HELLO, I'M</text>

      <text
        x="67" y="253"
        fill="url(#name)"
        font-size="82"
        font-weight="700"
        letter-spacing="-3"
      >Avanthika P S</text>

      <text
        x="72" y="307"
        fill="#C4B5FD"
        font-size="30"
      >Full-Stack Developer</text>

      <path
        d="M72 339H120"
        stroke="url(#accent)"
        stroke-width="2"
      />

      <text
        x="72" y="374"
        fill="#A5A0B9"
        font-size="18"
      >Thoughtful interfaces. Connected systems.</text>

      <!-- Layered geometric illustration -->
      <g stroke="url(#edge)">
        <path
          d="M1008 94L1164 184V334L1008 424L852 334V184Z"
          stroke-opacity="0.2"
        />

        <path
          d="M1008 119L1142 196V322L1008 399L874 322V196Z"
          stroke-opacity="0.35"
        />

        <path
          d="M900 200V326M1116 200V326"
          stroke-dasharray="3 7"
          stroke-opacity="0.4"
        />

        <path
          d="M1008 138L1116 200L1008 262L900 200Z"
          fill="url(#panel)"
        />

        <path
          d="M926 200L1008 153L1090 200L1008 247Z"
          stroke-opacity="0.25"
        />

        <path
          d="M1008 201L1116 263L1008 325L900 263Z"
          fill="#171928"
        />

        <path
          d="M1008 224L1076 263L1008 302L940 263Z"
          fill="#8270EC"
          fill-opacity="0.08"
          stroke-opacity="0.4"
        />

        <path
          d="M1008 264L1116 326L1008 388L900 326Z"
          fill="url(#panel)"
        />

        <path
          d="M947 326H1069M1008 291V361"
          stroke-opacity="0.25"
        />
      </g>

      <circle cx="1008" cy="138" r="4" fill="#C4B5FD"/>
      <circle cx="1116" cy="263" r="4" fill="#93A5FF"/>
      <circle cx="900" cy="326" r="4" fill="#A78BFA"/>
      <circle cx="1008" cy="388" r="4" fill="#7EA6F6"/>
      <circle cx="1008" cy="263" r="5" fill="#DDD6FE"/>

      <circle
        cx="1008" cy="263" r="13"
        stroke="#C4B5FD"
        stroke-opacity="0.2"
      />

      <text
        x="72" y="445"
        class="mono"
        fill="#9690AD"
        font-size="11"
        letter-spacing="1.3"
      >REACT · NEXT.JS · TYPESCRIPT · NODE.JS</text>

      <text
        x="1208" y="445"
        text-anchor="end"
        class="mono"
        fill="#9690AD"
        font-size="11"
        letter-spacing="1"
      >github.com/aonethika</text>
    </g>

    <!-- Compact layout for smaller screens -->
    <g class="mobile">
      <rect
        x="72" y="100"
        width="36" height="5"
        rx="2.5"
        fill="url(#accent)"
      />

      <text
        x="132" y="113"
        class="mono"
        fill="#BCB8D3"
        font-size="32"
        letter-spacing="4"
      >AONETHIKA</text>

      <text
        x="67" y="256"
        fill="url(#name)"
        font-size="118"
        font-weight="700"
        letter-spacing="-4"
      >Avanthika P S</text>

      <text
        x="72" y="338"
        fill="#C4B5FD"
        font-size="54"
      >Full-Stack Developer</text>

      <text
        x="72" y="440"
        class="mono"
        fill="#A5A0B9"
        font-size="30"
        letter-spacing="1"
      >REACT / NEXT.JS / TYPESCRIPT / NODE.JS</text>
    </g>

    <path
      d="M72 479H1208"
      stroke="url(#accent)"
      stroke-opacity="0.55"
    />
  </g>

  <rect
    x="1" y="1"
    width="1278" height="478"
    rx="24"
    stroke="#C4B5FD"
    stroke-opacity="0.16"
  />
</svg>
