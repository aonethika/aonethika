## 01 &nbsp; / &nbsp; Approach

Good software starts with understanding how people will use it.

I enjoy shaping the whole experience: how a screen responds, how data moves through an application, and how the pieces stay understandable as a product grows.

- **Interface craft** — responsive layouts, clear interactions, and purposeful visual detail.
- **Connected architecture** — bringing frontend state, APIs, and persistent data together.
- **Practical engineering** — readable code, deliberate abstractions, and maintainable foundations.

<br />

